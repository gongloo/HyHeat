name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@31d160e5f0ffa0ee65d5b27cb55c153d415f2abe # 2026.10.2
    with:
      files: |
        hyheat.yaml
      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@31d160e5f0ffa0ee65d5b27cb55c153d415f2abe # 2026.10.2
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
